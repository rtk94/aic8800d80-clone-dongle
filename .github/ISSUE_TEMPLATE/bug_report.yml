name: Bug report
description: The installer, uninstaller, udev rules, tests or documentation of this repository do not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Driver crashes, firmware errors and connection problems that also happen with upstream's code are best reported [upstream](https://github.com/shenmintao/aic8800d80/issues).
        Before pasting logs, read [CONTRIBUTING.md](https://github.com/rtk94/aic8800d80-clone-dongle/blob/main/CONTRIBUTING.md#before-you-post-anything-clean-your-logs).
  - type: input
    id: distro
    attributes:
      label: Distribution and version
      description: Output of `grep PRETTY_NAME /etc/os-release`
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel
      description: Output of `uname -r`
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: How you installed, and which revision
      description: For example "sudo ./install.sh at abc1234" (`git rev-parse --short HEAD`, or `cat /usr/src/aic8800-1.0.0/SOURCE_REVISION`)
    validations:
      required: true
  - type: textarea
    id: smoke
    attributes:
      label: Output of `sudo ./scripts/hw-smoke.sh`
      description: Run with the adapter plugged in. The script masks MAC addresses and serial numbers, but read the output before posting.
      render: text
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Other diagnostics, if relevant
      description: For install or build failures, `sudo ./diagnostic_build.sh` and the end of `/var/log/aic8800-install.log`. For Bluetooth problems, `sudo ./diagnose_bt.sh`.
      render: text
  - type: textarea
    id: what
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed MAC addresses, serial numbers, network names (SSIDs), IP addresses and passwords from everything above.
          required: true
